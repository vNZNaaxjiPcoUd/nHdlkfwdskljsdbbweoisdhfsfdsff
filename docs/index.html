<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>記</title>

    <script src="crypto-js.min.js"></script>
    <script src="marked.min.js"></script>
    <script src="mermaid.min.js"></script>
    <script src="umd.js"></script>
    <script src="d3@7.js"></script>
    <script src="markmap-lib.js"></script>
    <script src="markmap-view.js"></script>
    <script src="manifest.js"></script>
    <script src="keepLocal.v1.js"></script>
    <script defer src="ynote.obf.js"></script>
    <link rel="stylesheet" href="./style_black.css">

</head>
<body>
    <div class="main-container">
        <div class="tabs" id="mainTabs" >
            <div id="topBnt">
                <button class="tab-button" id="saveLocalBtn" title="本地保存" onclick="saveLocal()">存</button>
                <button class="tab-button" id="readLocalBtn" title="本地讀取" onclick="readLocal()">取</button>
                <button class="tab-button" title="閱讀模式" onclick="showMarkdownView()">讀</button>
                <button class="tab-button" id="saveDBBtn2" title="保存並上傳雲" onclick="saveToAPI()">上傳</button>
                <button class="tab-button" id="getDBBtn2" title="雲下載更新" onclick="getFromAPI()">下載</button>
                <button class="tab-button" id="addSubPageBtn" title="新增分頁" onclick="addEditableBlock()">➕</button>
            </div>
        </div>

        <div id="mkdwPage">
            <button id="toc-btn">☰</button>
            <button id="backToTopBtn" title="回到最前面" hidden>^</button>
            <nav id="toc" class="toc-sidebar"></nav>

            <div id="mdShowArea" style="display:none;">
                <div id="mdBtnTab" style="display:none;">
                    <button class="mdBtn" id="markdownReloadBtn" onclick="window.location.reload()">reload</button>
                    <button class="mdBtn" id="markdownViewBtn" onclick="showMarkdownView()">close</button>
                </div>
                <div id="mdText"></div>
                <svg id="markmap"></svg>
            </div>
        </div>

        <div id="TabA" class="tab-content">
            <button id="encBtn" onclick="updateDecData()">解密</button>
            <textarea id="encryptedContent" placeholder="在此貼上密文..."></textarea>
        </div>

        <div id="TabB" class="tab-content">
            <div class="sub-tabs-header">
                <div id="subTabNav" class="sub-tabs"></div>
            </div>
            <div id="subTabContentContainer" class="sub-tab-content-container"></div>
        </div>
    </div>
    
    <div id="statusMessage" class="status-info" title="閱讀/編輯" onclick="showMarkdownView()">待...</div>
    <div id="passwordOverlay" style="display:none">
        <input type="text" id="passwordInput" placeholder="訊息內容" autocomplete="off" value="" >
    </div>

    <dialog id="newPwdDialog"  style="background-color: #1a1a1a; color: #d3d3d3; border: none; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <input type="password" id="newPwd1" placeholder="輸入新密碼" style="background: transparent; border: none; border-bottom: 2px solid #ffd700; color: #ffffff; padding: 8px 12px; outline: none; font-size: 16px; text-align: center; width: 80%;"><br><br>
        <input type="password" id="newPwd2" placeholder="再次確認密碼" style="background: transparent; border: none; border-bottom: 2px solid #ffd700; color: #ffffff; padding: 8px 12px; outline: none; font-size: 16px; text-align: center; width: 80%;"><br><br>
        <button id="confirmBtn" style="background-color: #ffd700; color: #333333; border: none; border-radius: 25px; padding: 10px 24px; font-weight: bold; cursor: pointer; margin: 0 10px; box-shadow: 0 4px 0 #ccaa00;">確定</button>
        <button id="cancelBtn" style="background-color: #ffd700; color: #333333; border: none; border-radius: 25px; padding: 10px 24px; font-weight: bold; cursor: pointer; margin: 0 10px; box-shadow: 0 4px 0 #ccaa00;">取消</button>
    </dialog>

    <dialog id="PwdDialog" style="background-color: #1a1a1a; color: #d3d3d3; border: none; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <input type="password" id="pwdNow" placeholder="輸入密碼" style="background: transparent; border: none; border-bottom: 2px solid #ffd700; color: #ffffff; padding: 8px 12px; outline: none; font-size: 16px; text-align: center; width: 80%;"><br><br>
        <button id="confirmBtnPwdDialog" style="background-color: #ffd700; color: #333333; border: none; border-radius: 25px; padding: 10px 24px; font-weight: bold; cursor: pointer; margin: 0 10px; box-shadow: 0 4px 0 #ccaa00;">確定</button>
    </dialog>

    <dialog id="inputDialog" style="background-color: #1a1a1a; color: #d3d3d3; border: none; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <h2 id="inpTitle" style="margin-top: 0; color: #ffd700; font-size: 16px; font-weight: bold; margin-bottom: 5px;"></h2>
        <input type="text" id="inputT" placeholder="輸入內容" style="background: transparent; border: none; border-bottom: 2px solid #ffd700; color: #ffffff; padding: 8px 12px; outline: none; font-size: 16px; text-align: center; width: 80%;"><br><br>
        <button id="okCmd" style="background-color: #ffd700; color: #333333; border: none; border-radius: 10px; padding: 5px 10px; font-weight: bold; cursor: pointer; margin: 0 6px; box-shadow: 0 2px 0 #ccaa00;">確定</button>
        <button id="cancelCmd" style="background-color: #ffd700; color: #333333; border: none; border-radius: 10px; padding: 5px 10px; font-weight: bold; cursor: pointer; margin: 0 6px; box-shadow: 0 2px 0 #ccaa00;">取消</button>    
    </dialog>


</body>

</html>
