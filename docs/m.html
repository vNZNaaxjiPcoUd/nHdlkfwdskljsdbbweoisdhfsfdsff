    <!--link rel="stylesheet" href="./style_black.css"-->
    <script>
        (function() {
            const bookname = window.location.search.slice(1);
            window.title = "看雲";
            const surl  = window.location.origin + "/";
            const myManifest = {
                "name": "看雲",
                "short_name": "看雲",
                "description": "看雲",
                "display": "standalone",
                "theme_color": "#2196F3",
                "background_color": "#F0F0F0",
                "start_url": window.location.href,
                "scope": surl,
                "icons": [
                    { "src": "https://h.jwint.net/favicon192.png", "sizes": "192x192", "type": "image/png" },
                    { "src": "https://h.jwint.net/favicon512.png", "sizes": "512x512", "type": "image/png" }
                ],
                "orientation": "portrait"
            };
            const stringManifest = JSON.stringify(myManifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);

            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);    
        })();
    </script>
