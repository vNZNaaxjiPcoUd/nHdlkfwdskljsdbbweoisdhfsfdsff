function decData(){
    let originalText = "";
    let ret = true;
    const key = getKey();
    const encryptedText = encryptedContentArea.value;
    if (!key || key.trim() === "") { alert("請輸入密鑰", 'error'); return false; }
    if (!encryptedText) { console.log("無密文內容", 'error'); return false; }

    try {
        const keyHash = key;
        const bytes = CryptoJS.AES.decrypt(encryptedText, keyHash);
        originalText = bytes.toString(CryptoJS.enc.Utf8);
        console.log("originalText", originalText);
        if (originalText) {
            setContentToTabB(originalText);
        } else {
            console.log("解密錯誤，流程A");
            ret = false;
        }
    } catch (e) {
        console.log("解密發生錯誤。B", e);
        ret = false; 
    }
    return ret;
}

function generateToken() {
    const kNow = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const name=bookData.Name;
    const rawString = bookData.APIKey + SALT + kNow + name;
    return CryptoJS.SHA512(rawString).toString();
} 

async function callApi(params) {
    const token = generateToken();
    const queryString = new URLSearchParams({ ...params, token: token }).toString();
    const finalUrl = `${API_URL}?${queryString}`;
    try {
        const response = await fetch(finalUrl);
        const result = await response.json();
        return result;
    } catch (error) {
        console.error("API 請求失敗:", error);
        confirm("網路請求失敗，是否重試？");
        return { status: "error", message: "網路請求失敗" };
    }
}

async function doGet(key) {
    const res = await callApi({ action: "get", key: key, value: "123456", tag:"AAAAAA" });
    let newRes = null;
    if(res.status === "success"){
        newRes = { status: res.status, message: res.message, key: res.key, value: res.value, tag: res.tag };
    } else {
        console.log("讀取資料失敗:", res.message);
        newRes = { status: res.status, message: res.message, key: null, value: null, tag: null };
    }
    return newRes;
}

async function getFromAPI() {
    //return fakeGet();
    
    updateStatus("正在讀取...", 'info');
    if(!bookData.APIKey) { getAPIKey(); } 

    let res = await doGet(bookData.Name);

    if (res.status === "success" && res.value) {
        encryptedContentArea.value = res.value;
        bookData.tag = res.tag || "";
        let ret = false;
        while(!ret) {
            while(!bookData.aesKey) { await getAESKey(); }                
            ret = await decData();
            if (!ret) {
                console.log(`解密失敗，請確認 AES 密鑰是否正確`, 'error');
                cleanAESKey();
                await sleep(3000);    
            }
        }
    } else {
        console.log(`API 讀取失敗: ${res.message}`, 'error');
        showError();
    }
    if (res.status === "success") {
        updateStatus("讀取成功", 'success');
    }else{
        updateStatus("讀取失敗: " + res.message, 'error');
        showError();
    }
    return res;
}

    let aesKey ="";

    if (aesKey) {
        bookData.aesKey = aesKey;
    } else if(aesKey === "") {

        await sleep(3000);
        return false;
    }
    return true;
}

function addEditableBlock(title = "標題", text = "內容") {
    // 處理文字內容：將換行符號替換為 <br>，並用 div 包裝以限制寬度與強制換行

    const formattedText = text ? text.replace(/\n/g, '<br>') : "";
    const htmlBlock = `<div style="max-width: 450px; white-space: normal; line-height: 1.6; text-align: left; padding: 5px; background: #f8f9fa; border-radius: 5px; color: #333; font-size: 14px;">${formattedText}</div>`;
    // 為了讓心智圖效果更好，將標題作為一級或二級節點處理
    bookContent.push(text);
    //bookContent.push(`${htmlBlock}`);
    //bookContent.push(`## ${title}\n- ${htmlBlock}`);

    //bookContent.push(`## ${title} \n- ${htmlBlock}`);
    if (!btitle) {
        btitle = title;
        document.title = btitle;
    }
}

function setContentToTabB(fullContent) {
    let parseType = "v2";
    let blockStrings = fullContent.split('<<<<BLOCK_START_v2>>>>').filter(s => s.trim() !== "");

    if (blockStrings.length === 0 || blockStrings[0].indexOf('<<<<TITLE_END>>>>') === -1) {   
        const blockStrings2 = fullContent.split('<<<<BLOCK_START>>>>').filter(s => s.trim() !== "");
        if (blockStrings2.length === 0) return;
        parseType = "v1";
        blockStrings = blockStrings2;
    }
    blockStrings.forEach(blockStr => {
        const regex = new RegExp(`(.*?)\n<<<<TITLE_END>>>>\n(.*?)<<<<BLOCK_END>>>>`, 's');
        const match = blockStr.match(regex);
        if (match) {
            const safeTitle = match[1].trim();
            const title = parseType === "v2" ? decodeURIComponent(escape(atob(safeTitle))) : safeTitle;
            const safeText = match[2].trim();
            const text = parseType === "v2" ? decodeURIComponent(escape(atob(safeText))) : safeText;
            addEditableBlock(title, text);
        }
    });
}

// 宣告 Markmap 變數
let markmapInstance = null;

// Show markdown view (改為心智圖渲染)
let mdShownState = false;
function showMarkdownView() {
    let mdShow = document.getElementById('mdShowArea');
    let mdShowText = document.getElementById('mdText');
    let svgEl = document.getElementById('markmap');

    if(mdShownState) {
        // 隱藏狀態
        mdShow.style.display = "none";
        mdShownState = false;
        mdShowText.innerHTML = "";
        if (markmapInstance) {
            markmapInstance.destroy();
            markmapInstance = null;
        }
        svgEl.innerHTML = "";
        updateStatus("心智圖已隱藏", 'info');
        document.getElementById('TabB').style.display = "flex";
        document.getElementById('topBnt').style.display = "block";
        document.body.style.backgroundColor = "#f4f4f9a9";
        return;
    } else {
        // 顯示狀態
        const content = getTextFromTabB();
        if (content.trim() === "") {
            svgEl.style.display = "none";
            mdShowText.style.display = "block";
            mdShowText.innerHTML = "沒有內容可顯示";
            mdShow.style.display = "flex";
            mdShownState = true;
            return;
        }
        
        mdShowText.style.display = "none";
        svgEl.style.display = "block";

        // Markmap 解析與渲染
        //console.log(content);
        const transformer = new markmap.Transformer();
        const { root } = transformer.transform(content);
        
        svgEl.innerHTML = "";
        //markmapInstance = markmap.Markmap.create(svgEl, null, root);
        markmapInstance = markmap.Markmap.create(svgEl, { initialExpandLevel: 3 }, root);

        mdShow.style.display = "flex";
        mdShownState = true;
        updateStatus("心智圖已顯示", 'success');
        document.getElementById('TabB').style.display = "none";
        document.getElementById('topBnt').style.display = "none";
        document.body.style.backgroundColor = "#000000";

        return;
    }
}   

function getAESLocalKey(){
    localEncryptedKey = "U2FsdGVkX1/lGcDQ36P9KIOD8BcgdElZEuiOcAF2TWq32DYnLlAIAYtSIRDjRzT5t3L6MqEfBXRaKoz6R8zOTnkQM/kET6l/Q0btRp1dzi4=";
    const localKey = CryptoJS.AES.decrypt(localEncryptedKey, "QB1xLBSkU3GqjKBtq8a7sQh2Zt").toString(CryptoJS.enc.Utf8);

document.addEventListener('DOMContentLoaded', async () => {
    let result = "";
    const paramsFromURL = new URLSearchParams(window.location.search);
    const keys = paramsFromURL.keys();
    const firstKey = keys.next().value;
    const firstValue = paramsFromURL.get(firstKey);
    document.getElementById('topBnt').style.display = "none";
    document.getElementById('markdownViewBtn').style.display = "none";
    document.getElementById('setPW').style.display = "none";

    result = firstKey;
    bookData.aesKey = firstValue || getAESLocalKey();

    let res = null;

    if(!result){
        bookContent = ["## HelloWorld\n\nHere is your information."];
        showMarkdownView();
        return;
    }else{
        bookData.Name = result;
        document.title = bookData.Name;  
        try { 
            res = await getFromAPI();
            if(res.status !== "success"){
                throw new Error("getFromAPI 初始載入失敗");
            }
        } catch (error) {
            console.log("getFromAPI 發生錯誤:", error.message);
            updateStatus("找不到文章", 'error');
            return false;   
        }
  
        {
            showMarkdownView();
            document.getElementById('topBnt').style.display = "none";
            document.getElementById('markdownViewBtn').style.display = "none";
        }   
    }
});
